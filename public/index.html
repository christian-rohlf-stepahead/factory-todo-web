<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <main class="mx-auto flex w-full max-w-2xl flex-col gap-6 p-4 sm:p-8">
    <h1 class="text-2xl font-semibold tracking-tight">Todos</h1>

    <form id="add-form" class="card flex flex-col gap-3 sm:flex-row sm:items-end">
      <div class="flex-1">
        <label for="title-input" class="label">Title</label>
        <input id="title-input" type="text" placeholder="New todo" required class="input" />
      </div>
      <div class="sm:w-40">
        <label for="due-input" class="label">Due date</label>
        <input id="due-input" type="date" class="input" />
      </div>
      <button type="submit" class="btn-primary">Add</button>
    </form>

    <div class="flex flex-wrap items-center justify-end gap-2">
      <label for="sort-select" class="text-sm font-medium text-muted-foreground">Sort by</label>
      <select id="sort-select" class="select">
        <option value="">Default</option>
        <option value="priority">Priority</option>
        <option value="due">Due date (soonest first)</option>
      </select>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
