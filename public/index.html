<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Todo</title>
  <style>
    li.overdue { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Todos</h1>
  <form id="add-form">
    <input id="title-input" type="text" placeholder="New todo" required />
    <input id="due-input" type="date" />
    <button type="submit">Add</button>
  </form>
  <label for="sort-select">Sort by:
    <select id="sort-select">
      <option value="">Default</option>
      <option value="priority">Priority</option>
      <option value="due">Due date (soonest first)</option>
    </select>
  </label>
  <ul id="todo-list"></ul>
  <script src="/app.js"></script>
</body>
</html>
