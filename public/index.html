<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-background text-foreground antialiased pb-28 sm:pb-8">
  <main class="mx-auto flex w-full max-w-2xl flex-col gap-6 p-4 sm:p-8">
    <div class="top-row">
      <h1 class="text-2xl font-semibold tracking-tight">Todos</h1>
      <div class="flex items-center gap-2">
        <label for="sort-select" class="text-sm font-medium text-muted-foreground">Sort by</label>
        <select id="sort-select" class="select">
          <option value="">Default</option>
          <option value="priority">Priority</option>
          <option value="due">Due date (soonest first)</option>
        </select>
      </div>
    </div>

    <form id="add-form" class="composer card flex flex-wrap items-end gap-3">
      <div class="min-w-[8rem] flex-1">
        <label for="title-input" class="label">Title</label>
        <input id="title-input" type="text" placeholder="New todo" required class="input" />
      </div>
      <div class="w-36">
        <label for="due-input" class="label">Due date</label>
        <input id="due-input" type="date" class="input" />
      </div>
      <button type="submit" class="btn-primary">Add</button>
    </form>

    <div class="flex flex-wrap items-center gap-2">
      <button type="button" id="filter-overdue" class="chip" aria-pressed="false">Overdue</button>
      <div id="tag-filters" class="flex flex-wrap items-center gap-2"></div>
    </div>

    <div id="todo-list" class="todo-list">
      <section id="attention-section" class="attention-section">
        <h2 class="section-head">Needs attention</h2>
        <ul class="todo-sublist"></ul>
      </section>
      <section id="rest-section" class="rest-section">
        <h2 class="section-head">Everything else</h2>
        <ul class="todo-sublist"></ul>
      </section>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
